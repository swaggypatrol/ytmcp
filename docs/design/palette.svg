<text x="502" y="216" font-size="11.5" fill="#636368" letter-spacing="0.3">PANTONE 11-1400</text>
<text x="502" y="234" font-size="12" fill="#944562">What's playing; primary action</text>
<g filter="url(#s)"><rect x="712" y="108" width="206" height="138" rx="16" fill="#ffffff"/></g>
<rect x="722" y="118" width="186" height="58" rx="10" fill="#dbd3dd" stroke="#00000010"/>
<circle cx="892" cy="147" r="7" fill="#6f4b79"/>
