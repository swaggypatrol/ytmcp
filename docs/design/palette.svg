<text x="278" y="392" font-size="12" fill="#4e6334">Done and confirmed</text>
<g filter="url(#s)"><rect x="488" y="266" width="206" height="138" rx="16" fill="#ffffff"/></g>
<rect x="498" y="276" width="186" height="58" rx="10" fill="#f5ecc9" stroke="#00000010"/>
