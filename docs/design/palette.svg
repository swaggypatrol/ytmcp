<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The YTMcp palette: eight Pantone pastels, each with one job</title>
<defs><filter id="s" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2a2030" flood-opacity="0.12"/></filter></defs>
<rect width="960" height="420" rx="22" fill="#f7f6f3"/>
<text x="40" y="54" font-size="20" font-weight="700" fill="#1f1f24">Eight colors, eight jobs</text>
<text x="40" y="80" font-size="13.5" fill="#4c4c52">The swatch is the soft fill. Text and marks use the same hue, darker by day and lighter at night.</text>
<g filter="url(#s)"><rect x="40" y="108" width="206" height="138" rx="16" fill="#ffffff"/></g>
<rect x="50" y="118" width="186" height="58" rx="10" fill="#efeeeb" stroke="#00000010"/>
<circle cx="220" cy="147" r="7" fill="#1f1f24"/>
<text x="54" y="198" font-size="14" font-weight="650" fill="#1f1f24">Cloud Dancer</text>
<text x="54" y="216" font-size="11.5" fill="#636368" letter-spacing="0.3">PANTONE 11-4201</text>
<text x="54" y="234" font-size="12" fill="#1f1f24">Day canvas; the night's text</text>
<g filter="url(#s)"><rect x="264" y="108" width="206" height="138" rx="16" fill="#ffffff"/></g>
<rect x="274" y="118" width="186" height="58" rx="10" fill="#d4d4d6" stroke="#00000010"/>
<circle cx="444" cy="147" r="7" fill="#4c4c52"/>
