<text x="278" y="216" font-size="11.5" fill="#636368" letter-spacing="0.3">PANTONE 13-4108</text>
<text x="278" y="234" font-size="12" fill="#4c4c52">Neutral text, hairlines, switches</text>
<g filter="url(#s)"><rect x="488" y="108" width="206" height="138" rx="16" fill="#ffffff"/></g>
<rect x="498" y="118" width="186" height="58" rx="10" fill="#e9d7dc" stroke="#00000010"/>
<circle cx="668" cy="147" r="7" fill="#944562"/>
