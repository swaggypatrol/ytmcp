<text x="726" y="216" font-size="11.5" fill="#636368" letter-spacing="0.3">PANTONE 13-3802</text>
<text x="726" y="234" font-size="12" fill="#6f4b79">The AI DJ</text>
<g filter="url(#s)"><rect x="40" y="266" width="206" height="138" rx="16" fill="#ffffff"/></g>
<rect x="50" y="276" width="186" height="58" rx="10" fill="#d6e2ef" stroke="#00000010"/>
