<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How YTM Glass is wired: the official player page plays, the Rust core decides, four front doors share one command path</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0f1f"/>
      <stop offset="0.55" stop-color="#0d0d14"/>
      <stop offset="1" stop-color="#0f1530"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3254a"/>
      <stop offset="1" stop-color="#7a2bd8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9c9d6"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="22" fill="url(#bg)"/>

  <!-- left: the four front doors -->
  <g font-size="15" fill="#f2f2f7">
    <rect x="36" y="58" width="210" height="62" rx="14" fill="#ffffff14" stroke="#ffffff30"/>
    <text x="56" y="85" font-weight="600">Glass interface</text>
    <text x="56" y="106" font-size="12.5" fill="#b9b9c8">Svelte, in its own window</text>

    <rect x="36" y="140" width="210" height="62" rx="14" fill="#ffffff14" stroke="#ffffff30"/>
    <text x="56" y="167" font-weight="600">Tray</text>
    <text x="56" y="188" font-size="12.5" fill="#b9b9c8">play, pause, skip, show, quit</text>

    <rect x="36" y="222" width="210" height="62" rx="14" fill="#ffffff14" stroke="#ffffff30"/>
    <text x="56" y="249" font-weight="600">Media keys · Plasma</text>
    <text x="56" y="270" font-size="12.5" fill="#b9b9c8">MPRIS on the session bus</text>

    <rect x="36" y="304" width="210" height="62" rx="14" fill="#ffffff14" stroke="#7a2bd8" stroke-width="1.5"/>
    <text x="56" y="331" font-weight="600">Your AI agent</text>
    <text x="56" y="352" font-size="12.5" fill="#b9b9c8">ytm-glass-mcp, 39 tools</text>
  </g>
  <text x="141" y="40" font-size="12" fill="#8f8fa3" text-anchor="middle" letter-spacing="1.5">FOUR FRONT DOORS</text>

  <!-- arrows into the core -->
  <g stroke="#c9c9d6" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M246 89 C300 89 310 190 362 200"/>
    <path d="M246 171 C300 171 320 205 362 210"/>
    <path d="M246 253 C300 253 320 225 362 222"/>
    <path d="M246 335 C300 335 310 240 362 232"/>
  </g>
  <text x="304" y="398" font-size="12.5" fill="#b9b9c8" text-anchor="middle">one command path</text>
  <text x="304" y="416" font-size="12.5" fill="#b9b9c8" text-anchor="middle">same state for everyone</text>

  <!-- core -->
  <rect x="366" y="120" width="250" height="196" rx="20" fill="url(#core)"/>
  <text x="491" y="160" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Rust core</text>
  <g font-size="13" fill="#fff" text-anchor="middle">
    <text x="491" y="192">holds the one true state</text>
    <text x="491" y="214">serializes every command</text>
    <text x="491" y="236">a hand on the keys beats the agent</text>
    <text x="491" y="258">account writes: granted, budgeted,</text>
    <text x="491" y="276">journaled, read back</text>
    <text x="491" y="300" font-size="11.5" fill="#ffffffcc">ytm-daemon · SQLite · comes back after a crash</text>
  </g>

  <!-- arrows to the page -->
  <g stroke="#c9c9d6" stroke-width="1.6" fill="none">
    <path d="M616 196 L706 196" marker-end="url(#arrow)"/>
    <path d="M706 240 L616 240" marker-end="url(#arrow)"/>
  </g>
  <text x="661" y="186" font-size="12" fill="#b9b9c8" text-anchor="middle">commands</text>
  <text x="661" y="260" font-size="12" fill="#b9b9c8" text-anchor="middle">what really</text>
  <text x="661" y="275" font-size="12" fill="#b9b9c8" text-anchor="middle">happened</text>

  <!-- the page -->
  <rect x="710" y="120" width="214" height="196" rx="20" fill="#ffffff10" stroke="#ffffff40" stroke-dasharray="5 5"/>
  <text x="817" y="160" font-size="16" font-weight="700" fill="#f2f2f7" text-anchor="middle">Official player page</text>
  <g font-size="13" fill="#d7d7e2" text-anchor="middle">
    <text x="817" y="190">music.youtube.com</text>
    <text x="817" y="212">in a hidden window</text>
    <text x="817" y="244" fill="#ff5c7a" font-weight="600">plays the audio</text>
    <text x="817" y="266">no downloads, no rips</text>
    <text x="817" y="296" font-size="11.5" fill="#9e9eb0">a small bridge reports back</text>
  </g>

  <text x="480" y="444" font-size="12" fill="#8f8fa3" text-anchor="middle">The page is the truth about playback. The core is the truth about everything else.</text>
</svg>
